# Must match the Worker's name in the Cloudflare dashboard.
name = "plugboard"
main = "worker/index.ts"
compatibility_date = "2026-09-01"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "404-page"

# Keep Worker logs so errors show up under the Worker's Observability tab.
[observability]
enabled = true

[vars]
GITHUB_REPO = "gyrevik/plugboard"
# GITHUB_TOKEN and TURNSTILE_SECRET_KEY are secrets: set them in the Cloudflare
# dashboard (Worker > Settings > Variables and Secrets), or in .dev.vars for local testing.

# Preview deployments (pull request branches, via `wrangler preview`). An empty repo
# turns the submit form off there, so a preview can never open real GitHub issues.
[previews.vars]
GITHUB_REPO = ""
